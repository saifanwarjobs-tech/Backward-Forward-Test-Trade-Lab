name: Update screener data
on:
  schedule:
    - cron: '30 13 * * 1-5'   # 19:00 IST, after NSE publishes the end-of-day file
    - cron: '30 15 * * 1-5'   # 21:00 IST, retry in case NSE was late
  workflow_dispatch: {}       # Actions tab > Run workflow, to run it by hand
permissions:
  contents: write
concurrency:
  group: screener
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download NSE data and rebuild data/screener.json
        id: run
        continue-on-error: true
        run: python scripts/update_screener.py
      - name: Commit changes
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update screener data" && git push)
      - name: Fail the run if the download had errors
        if: steps.run.outcome == 'failure'
        run: exit 1
