<script>

if(!window.supabase){$('#boot').textContent='Could not load the Supabase library. Check your internet connection and reload.'}else{

 await load()}

 const[a,b,c,d,e]=await Promise.all([sb.from('items').select('*').order('sort').order('created_at'),sb.from('lessons').select('*').order('sort').order('created_at'),sb.from('lesson_secrets').select('lesson_id,video_url,video_path'),sb.from('students').select('*').order('created_at',{ascending:false}),sb.from('item_secrets').select('item_id,pdf_path,code,video_url')]);

function upload(bucket,path,file,onp){return new Promise(async(res,rej)=>{const{data:{session}}=await sb.auth.getSession();if(!session)return rej(new Error('Session expired. Sign in again.'));const x=new XMLHttpRequest();x.open('POST',SB_URL+'/storage/v1/object/'+bucket+'/'+path.split('/').map(encodeURIComponent).join('/'));x.setRequestHeader('Authorization','Bearer '+session.access_token);x.setRequestHeader('apikey',SB_KEY);x.setRequestHeader('x-upsert','true');x.setRequestHeader('Content-Type',file.type||'application/octet-stream');
 x.upload.onprogress=e=>{if(e.lengthComputable&&onp)onp(e.loaded/e.total)};x.onload=()=>{if(x.status<300)return res();let m='';try{m=JSON.parse(x.responseText).message}catch(_){}rej(new Error(x.status===413?'File too large for your Supabase plan (free plan limit is 50 MB). Paste a YouTube/Vimeo/Bunny link instead, or upgrade the plan.':(m||'Upload failed ('+x.status+')')))};x.onerror=()=>rej(new Error('Network error during upload'));x.send(file)})}
const rm=(bucket,paths)=>paths.length?sb.storage.from(bucket).remove(paths):Promise.resolve();
function shrink(file,max){return new Promise(r=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>r(b||file),'image/jpeg',.85)};img.onerror=()=>r(file);img.src=u})}
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const durOf=f=>new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{const d=v.duration;URL.revokeObjectURL(v.src);r(isFinite(d)?fmtDur(d):'')};v.onerror=()=>r('');v.src=URL.createObjectURL(f)});
const setProg=(id,p,t)=>{const e=$('#'+id);if(!e)return;e.classList.remove('hid');e.querySelector('i').style.width=Math.round(p*100)+'%';if(t&&e.nextElementSibling)e.nextElementSibling.textContent=t};

/* ---------- bulk import lessons from a YouTube playlist ---------- */
const ytId=u=>{u=String(u||'').trim();const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:'')};
const ytIso=s=>{const m=String(s||'').match(/^P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?$/);if(!m)return '';return fmtDur((+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0))};
async function ytApi(path,key){const r=await fetch('https://www.googleapis.com/youtube/v3/'+path+(path.includes('?')?'&':'?')+'key='+encodeURIComponent(key));const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('YouTube API error '+r.status));return j}
async function ytDetails(ids,key){const out={};for(let i=0;i<ids.length;i+=50){const j=await ytApi('videos?part=contentDetails,snippet,status&maxResults=50&id='+ids.slice(i,i+50).join(','),key);(j.items||[]).forEach(v=>out[v.id]={dur:ytIso(v.contentDetails&&v.contentDetails.duration),title:v.snippet&&v.snippet.title,priv:v.status&&v.status.privacyStatus==='private'})}return out}
async function ytCollect(text,key){
 const lines=text.split('\n').map(x=>x.trim()).filter(Boolean),found=[],seen=new Set();
 const add=(id,title)=>{if(id&&!seen.has(id)){seen.add(id);found.push({id,title:title||'',dur:''})}};
 for(const ln of lines){const pl=ln.match(/[?&]list=([\w-]+)/);
  if(pl){if(!key)throw new Error('A playlist needs a YouTube API key. Add it in Settings, or paste the video links one per line instead.');
   let tok='',n=0;do{const j=await ytApi('playlistItems?part=snippet,status&maxResults=50&playlistId='+pl[1]+(tok?'&pageToken='+tok:''),key);(j.items||[]).forEach(it=>{const t=(it.snippet&&it.snippet.title)||'',id=it.snippet&&it.snippet.resourceId&&it.snippet.resourceId.videoId;if(/^(private|deleted) video$/i.test(t))return;add(id,t)});tok=j.nextPageToken||'';n++}while(tok&&n<20)}
  else add(ytId(ln.split(/[ \t|]/)[0]),ln.includes('|')?ln.split('|').slice(1).join('|').trim():'')}
 if(!found.length)throw new Error('No YouTube links found. Paste a playlist link or video links.');
 if(key){try{const d=await ytDetails(found.map(x=>x.id),key);for(let i=found.length-1;i>=0;i--){const v=d[found[i].id];if(!v){found.splice(i,1);continue}if(v.priv){found.splice(i,1);continue}found[i].dur=v.dur||'';if(!found[i].title)found[i].title=v.title||''}}catch(e){if(!/quota/i.test(e.message))throw e}}
 else for(const f of found){if(f.title)continue;try{const r=await fetch('https://www.youtube.com/oembed?format=json&url='+encodeURIComponent('https://youtu.be/'+f.id));if(r.ok)f.title=(await r.json()).title||''}catch(_){}}
 found.forEach((f,i)=>{if(!f.title)f.title='Lesson '+(i+1)});return found}

 $('#y_res').oninput=e=>{const t=e.target;if(t.dataset.yt!==undefined)st.vids[+t.dataset.yt].title=t.value};
 $('#y_res').onchange=e=>{const t=e.target;if(t.dataset.yc!==undefined)st.vids[+t.dataset.yc].on=t.checked;if(t.id==='y_all')st.vids.forEach(v=>v.on=t.checked);draw()};

  try{if(key)try{localStorage.setItem('bft_yt_key',key)}catch(_){}
   st.vids=(await ytCollect($('#y_t').value,key)).map(v=>({...v,dup:have.has(v.id),on:!have.has(v.id)}));draw()}catch(e){st.vids=[];draw();toast(e.message||String(e))}
  b.disabled=false;b.textContent='Fetch again'};
 $('#sv2').onclick=async()=>{const pick=st.vids.filter(v=>v.on);if(!pick.length)return toast('Fetch videos first');
  const b=$('#sv2');b.disabled=true;b.textContent='Importing…';
  const mod=$('#y_m').value.trim()||'Module 1',nf=Math.max(0,parseInt($('#y_f').value)||0),base=Math.max(-10,...lessonsOf(E.id).map(x=>x.sort))+10;
  const rows=pick.map((v,i)=>({id:uid(),item_id:E.id,module:mod,title:(v.title||'').trim()||'Lesson '+(i+1),duration:v.dur||null,free:i<nf,lab:null,sort:base+i*10}));
  const sec=rows.map((r,i)=>({lesson_id:r.id,video_url:'https://youtu.be/'+pick[i].id,video_path:null}));
  try{const r1=await sb.from('lessons').insert(rows);if(r1.error)throw r1.error;
   const r2=await sb.from('lesson_secrets').insert(sec);if(r2.error){await sb.from('lessons').delete().in('id',rows.map(r=>r.id));throw r2.error}
   const now=new Date().toISOString();rows.forEach(r=>S.lessons.push({...r,created_at:now}));sec.forEach(x=>S.lsec[x.lesson_id]=x);
   closeSheet(2);renderLessons();renderContent();renderDash();toast(rows.length+' lessons imported ✓')}
  catch(e){toast(e.message||String(e));b.disabled=false;b.textContent='Import '+pick.length}}}

const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,Math.round(m))+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
function progCard(){
 if(S.progErr)return/function|schema cache|does not exist/i.test(S.progErr)?'<div class="alert wn"><span>⚠️</span><div><b>Progress tracking is not set up</b><span class="mu">Run the latest schema.sql once in Supabase → SQL Editor, then reload.</span></div></div>':'';
 const cs=ofKind('course').filter(c=>lessonsOf(c.id).length);if(!cs.length)return'';
 const cid=cs.some(c=>c.id===S.pc)?S.pc:cs[0].id,L=lessonsOf(cid),mx=Math.max(1,...L.map(l=>S.lp[l.id]||0)),seen=Object.keys(S.sp).length;
 return`<div class="card"><div class="row spb"><h2>Lesson completion</h2><select id="pc_sel" style="width:auto;max-width:62%" aria-label="Course">${cs.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><p class="mu" style="font-size:12.5px;margin:6px 0 4px">Students who marked each lesson complete (${seen} student${seen===1?' has':'s have'} opened a lesson). A sharp drop shows where students leave.</p>${L.map((l,i)=>{const n=S.lp[l.id]||0;return`<div style="padding:7px 0;border-top:1px solid var(--ln)"><div class="row spb" style="gap:8px;flex-wrap:nowrap"><span style="font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${i+1}. ${esc(l.title)}</span><b>${n}</b></div><div class="prog" style="margin-top:4px;height:6px"><i style="width:${Math.round(n/mx*100)}%"></i></div></div>`}).join('')}</div>`}
function progBox(s){
 const p=S.sp[s.email];if(!p)return'<div class="card" style="margin-top:16px"><b>Progress</b><p class="mu" style="margin-top:4px;font-size:14px">Has not opened a lesson yet.</p></div>';
 const l=S.lessons.find(x=>x.id===p.last_lesson);
 return`<div class="card" style="margin-top:16px"><b>Progress</b><p class="mu" style="margin-top:4px;font-size:14px">Completed ${p.lessons_done} of ${S.lessons.length} lessons<br>Last active ${fmtD(p.last_seen)} (${ago(p.last_seen)})${l?'<br>Last lesson: '+esc(l.title):''}</p></div>`}

/* ---------- students ---------- */
const academyUrl=()=>location.href.replace(/admin\.html.*$/,'academy.html');
function wa(s,kind){let p=String(s.phone||'').replace(/\D/g,'');if(p.length===10)p='91'+p;const t=kind==='renew'?`Hi! Your BFT Academy access (${s.email}) ends soon. Reply here to renew.`:`Hi! Your BFT Academy access is active. Sign in with ${s.email} here: ${academyUrl()}`;return'https://wa.me/'+p+'?text='+encodeURIComponent(t)}
let sFilter='all';
let sLim=50;document.addEventListener('click',e=>{if(e.target.id==='smore'){sLim+=50;renderStudents()}});function renderStudents(){
 const q=($('#sq').value||'').toLowerCase().trim(),A=S.students,on=A.filter(s=>stat(s).on).length,ex=A.length-on,soon=A.filter(s=>stat(s).soon).length;
 $('#ssum').innerHTML=[['all','All '+A.length],['act','Active '+on],['soon','Expiring '+soon],['exp','Expired '+ex]].map(k=>`<button class="chip ${sFilter===k[0]?'on':''}" data-f="${k[0]}">${k[1]}</button>`).join('');
 const L=A.filter(s=>(!q||(s.email+' '+(s.note||'')+' '+(s.phone||'')).toLowerCase().includes(q))&&(sFilter==='all'||(sFilter==='act'&&stat(s).on)||(sFilter==='soon'&&stat(s).soon)||(sFilter==='exp'&&!stat(s).on)));
 $('#slist').innerHTML=L.slice(0,sLim).map(s=>{const t=stat(s);return`<div class="it"><div class="t" data-stu="${esc(s.email)}"><b>${esc(s.email)}</b><div class="row"><span class="k ${t.c}">${t.t}</span>${s.amount?`<span class="k">${rs(s.amount)}</span>`:''}${s.note?`<span class="k">${esc(s.note)}</span>`:''}${S.progErr?'':(S.sp[s.email]?`<span class="k ac">✓ ${S.sp[s.email].lessons_done}/${S.lessons.length}</span><span class="k">seen ${ago(S.sp[s.email].last_seen)}</span>`:(t.on?'<span class="k">Not started</span>':''))}</div></div><div class="a">${s.phone?`<a class="btn o ic" target="_blank" rel="noopener" href="${wa(s)}" aria-label="WhatsApp" title="WhatsApp">💬</a>`:''}<button class="btn o ic" data-stu="${esc(s.email)}" aria-label="Edit">✎</button></div></div>`}).join('')+(L.length>sLim?`<button class="btn o" id="smore" style="width:100%">Show ${Math.min(50,L.length-sLim)} more</button>`:'')||`<div class="empty">${A.length?'No students match.':'No students yet. Tap “＋ Add” after a payment arrives.'}</div>`}
$('#sq').oninput=renderStudents;
$('#ssum').onclick=e=>{const b=e.target.closest('[data-f]');if(b){sFilter=b.dataset.f;renderStudents()}};
$('#slist').onclick=e=>{const t=e.target.closest('[data-stu]');if(t)stuSheet(t.dataset.stu)};
$('#sadd').onclick=()=>stuSheet(null);
function addPlan(v){if(v==='life')return'';const d=new Date();if(v==='1y')d.setFullYear(d.getFullYear()+1);if(v==='6m')d.setMonth(d.getMonth()+6);if(v==='3m')d.setMonth(d.getMonth()+3);return d.toISOString().slice(0,10)}
function stuSheet(email){
 const s=email?S.students.find(z=>z.email===email):null,exp=s&&s.expires_at?new Date(s.expires_at).toISOString().slice(0,10):'';
 sheet(2,s?'Edit student':'Add student',`<label for="s_e" style="margin-top:0">Email (the one they sign in with) *</label><input id="s_e" type="email" inputmode="email" autocapitalize="off" value="${esc(s?s.email:'')}" ${s?'readonly':''} placeholder="buyer@email.com">
 <div class="g2 keep"><div><label for="s_a">Amount paid (₹)</label><input id="s_a" type="number" min="0" inputmode="numeric" value="${s&&s.amount||''}" placeholder="4999"></div><div><label for="s_p">WhatsApp number</label><input id="s_p" type="tel" inputmode="tel" value="${esc(s&&s.phone||'')}" placeholder="98xxxxxxxx"></div></div>
 <label for="s_pl">Access</label><select id="s_pl"><option value="life" ${!exp?'selected':''}>Lifetime</option><option value="1y">1 year from today</option><option value="6m">6 months from today</option><option value="3m">3 months from today</option><option value="c" ${exp?'selected':''}>Custom date</option></select>
 <div id="s_dw" class="${exp?'':'hid'}"><label for="s_x">Access ends on</label><input id="s_x" type="date" value="${exp}"></div>
 <label for="s_n">Note</label><input id="s_n" value="${esc(s&&s.note||'')}" placeholder="e.g. UPI, 18 Oct">
 ${s&&!S.progErr?progBox(s):''}
 ${s?`<a class="btn o" id="s_wa" style="margin-top:16px;width:100%;text-decoration:none;${s.phone?'':'display:none'}" target="_blank" rel="noopener" href="${s.phone?wa(s):'#'}">💬 Send “access active” on WhatsApp</a><button class="btn d" id="s_del" type="button" style="margin-top:14px;width:100%">Remove access</button>`:''}`,'Save');
 $('#s_pl').onchange=e=>{const v=e.target.value;$('#s_dw').classList.toggle('hid',v==='life');if(v!=='life'&&v!=='c')$('#s_x').value=addPlan(v);if(v==='c'&&!$('#s_x').value)$('#s_x').value=addPlan('1y')};
 $('#sv2').onclick=async()=>{const em=$('#s_e').value.trim().toLowerCase();if(!/\S+@\S+\.\S+/.test(em))return toast('Enter a valid email');
  const pl=$('#s_pl').value,xd=pl==='life'?null:$('#s_x').value;if(pl!=='life'&&!xd)return toast('Pick the end date');
  const row={email:em,note:$('#s_n').value.trim()||null,phone:$('#s_p').value.trim()||null,amount:parseInt($('#s_a').value)||null,expires_at:xd?new Date(xd+'T23:59:59').toISOString():null};
  if(!s&&S.students.some(z=>z.email===em)&&!await ask('Already a student','This email already has access. Overwrite its details?','Overwrite'))return;
  const b=$('#sv2');b.disabled=true;const{error}=await sb.from('students').upsert(row);b.disabled=false;if(error)return toast(error.message);closeSheet(2);toast('Saved ✓');await load()};
 const dl=$('#s_del');if(dl)dl.onclick=async()=>{if(!await ask('Remove access?',s.email+' will no longer be able to open paid content.','Remove',true))return;const{error}=await sb.from('students').delete().eq('email',s.email);if(error)return toast(error.message);closeSheet(2);toast('Removed');await load()}}
$('#scsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['email','phone','amount','access_until','note','added']].concat(S.students.map(s=>[s.email,s.phone,s.amount,s.expires_at?new Date(s.expires_at).toISOString().slice(0,10):'lifetime',s.note,new Date(s.created_at).toISOString().slice(0,10)]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='bft-students-'+new Date().toISOString().slice(0,10)+'.csv';a.click()};

sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')showLogin()});
init().catch(e=>showLogin(e.message));
}
</script></body></html>
