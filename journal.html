<script>
const $=s=>document.querySelector(s),K='bft_journal_v1',MIS=['Revenge','FOMO','No SL','Oversize','Early exit','Overtrading'];
let S={tr:[],hide:0,theme:'dark',glow:1,lossLim:5000,maxTr:5,demo:1},first=1,cm=null,hm='r',eqv='n';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const gross=t=>(t.x-t.e)*t.q*(t.s=='L'?1:-1),net=t=>gross(t)-(t.ch||0),risk=t=>t.sl?Math.abs(t.e-t.sl)*t.q:0,R=t=>risk(t)?net(t)/risk(t):null;
const D=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const inr=n=>Math.abs(Math.round(n)).toLocaleString('en-IN'),m=(n,sg=1)=>S.hide?'₹ ••••':(sg?(n>=0?'▲ +':'▼ −'):(n<0?'−':''))+'₹'+inr(n),cl=n=>n>=0?'up':'dn';
const sum=a=>a.reduce((x,y)=>x+y,0),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function demo(){let a=42;const r=()=>{a=(a+0x6d2b79f5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const Y=[['NIFTY 24500 CE',75,120],['NIFTY 24500 PE',75,110],['BANKNIFTY 52000 CE',30,260],['BANKNIFTY 52000 PE',30,240]],o=[],d=new Date();d.setDate(d.getDate()-170);d.setHours(0,0,0,0);
while(d<new Date()){d.setDate(d.getDate()+1);if(d.getDay()%6==0)continue;const n=1+Math.floor(r()*5);let tm=d.getTime()+(9*60+16+Math.floor(r()*30))*60000,pl=0;
for(let i=0;i<n;i++){const[y,l,b]=Y[Math.floor(r()*4)],lots=1+Math.floor(r()*2),rev=pl&&r()<.5,q=l*(rev?lots+1:lots),bad=rev?'Revenge':r()<.1+i*.06?MIS[1+Math.floor(r()*4)]:'',e=+(b*(.8+r()*.4)).toFixed(2),s=r()<.7?'L':'S',mv=(r()-.5)*.26+(bad?-.04:.012),x=+Math.max(.05,e*(1+(s=='L'?mv:-mv))).toFixed(2);
tm+=(4+Math.floor(r()*40))*60000;const t={id:'d'+o.length,t:tm,sym:y,s,q,e,x,sl:bad=='No SL'?0:+(s=='L'?e*.9:e*1.1).toFixed(2),ch:Math.round(40+q*.3),tag:bad?[bad]:[]};o.push(t);pl=net(t)<0?1:0;tm+=(6+Math.floor(r()*30))*60000}}return o}
/* ---------- load (after helpers exist) ---------- */
try{const j=localStorage.getItem(K);if(j)S=Object.assign(S,JSON.parse(j));else S.tr=demo()}catch(e){S.tr=demo()}
/* ---------- analytics (pure) ---------- */
const sorted=()=>[...S.tr].sort((a,b)=>a.t-b.t);
function calc(T){const p=T.map(net),w=p.filter(v=>v>0),l=p.filter(v=>v<0);let c=0,pk=0,dd=0;const eq=p.map(v=>c+=v),ddc=eq.map(v=>{pk=Math.max(pk,v);dd=Math.min(dd,v-pk);return v-pk});
let dc=0;const dis=T.map(t=>dc+=t.tag.length?0:net(t));
return{p,eq,ddc,dis,net:c,n:p.length,wr:p.length?w.length/p.length:0,pf:l.length?sum(w)/-sum(l):(w.length?Infinity:0),ex:p.length?c/p.length:0,dd,cost:Math.max(0,(dis[dis.length-1]||0)-c),disc:p.length?T.filter(t=>!t.tag.length&&t.sl).length/p.length:0}}
const byDay=T=>{const o={};T.forEach(t=>(o[D(t.t)]=o[D(t.t)]||[]).push(t));return o};
const refDay=T=>{const td=D(Date.now());return T.some(t=>D(t.t)==td)?td:(T.length?D(T[T.length-1].t):td)};
function leaks(T){const L=[],tags={};T.forEach(t=>t.tag.forEach(g=>{(tags[g]=tags[g]||[]).push(net(t))}));
Object.entries(tags).forEach(([g,v])=>{if(sum(v)<0)L.push({t:'Mistake: '+g,c:-sum(v),n:v.length,a:'Write one rule that blocks "'+g+'" and tick it before every entry.'})});
const days=byDay(T),rv=[],ov=[];Object.values(days).forEach(a=>{a.forEach((t,i)=>{if(i&&net(a[i-1])<0&&t.t-a[i-1].t<20*6e4&&t.q>a[i-1].q&&!t.tag.length)rv.push(net(t));if(i>=S.maxTr&&!t.tag.length)ov.push(net(t))})});
if(sum(rv)<0)L.push({t:'Bigger re-entry soon after a loss (auto-detected)',c:-sum(rv),n:rv.length,a:'After a loss, wait 20 minutes and never size up.'});
if(sum(ov)<0)L.push({t:'Trades beyond your '+S.maxTr+'-a-day limit',c:-sum(ov),n:ov.length,a:'Close the terminal after trade '+S.maxTr+'.'});
const hh={};T.forEach(t=>{const h=new Date(t.t).getHours();(hh[h]=hh[h]||[]).push(net(t))});
Object.entries(hh).forEach(([h,v])=>{if(v.length>=8&&sum(v)<0)L.push({t:'Trades closed around '+h+':00',c:-sum(v),n:v.length,a:'Avoid or halve size in this window; review those trades.'})});
const ch=sum(T.map(t=>t.ch||0)),gw=sum(T.map(gross).filter(v=>v>0));if(gw&&ch/gw>.15)L.push({t:'Charges eat '+Math.round(ch/gw*100)+'% of gross profit',c:ch,n:T.length,a:'Trade fewer, larger-conviction setups; check brokerage plan.'});
return L.sort((a,b)=>b.c-a.c).slice(0,5)}
function optCount(T){const k={};Object.values(byDay(T)).forEach(a=>a.forEach((t,i)=>{const j=Math.min(i,5);(k[j]=k[j]||[]).push(net(t))}));
const rows=[0,1,2,3,4,5].map(j=>({j:j+1,n:(k[j]||[]).length,a:(k[j]||[]).length?sum(k[j])/k[j].length:0})),bad=rows.find(r=>r.n>=10&&r.a<0);
return{rows,msg:bad?`Your trade #${bad.j}${bad.j==6?'+':''} averages ${m(bad.a)} (${bad.n} trades). Consider stopping at ${Math.max(1,bad.j-1)}.`:'No clear drop-off by trade number yet (need 10+ trades per bucket).'}}
function tilt(T){const day=refDay(T),a=T.filter(t=>D(t.t)==day),w=[];let s=0,c=0;for(let i=a.length-1;i>=0&&net(a[i])<0;i--)c++;
if(c>=2){s+=Math.min(40,c*15);w.push(c+' losses in a row')}const l=a[a.length-1],p=a[a.length-2];if(l&&p&&net(p)<0&&l.q>p.q){s+=20;w.push('size increased after a loss')}
const hr=l?a.filter(t=>l.t-t.t<36e5).length:0;if(hr>=3){s+=15;w.push(hr+' trades in the last hour')}const dn=sum(a.map(net));if(dn<0&&-dn>=S.lossLim*.8){s+=25;w.push('daily loss limit '+Math.round(-dn/S.lossLim*100)+'% used')}
if(a.length>S.maxTr){s+=15;w.push('over your '+S.maxTr+'-trade limit')}return{s:Math.min(100,s),w,day,n:a.length,dn}}
function gateOf(T,dr){const t=tilt(T),w=[...t.w];let lv=t.s>=60||t.dn<=-S.lossLim||t.n>=S.maxTr?2:t.s>=30||-t.dn>=S.lossLim*.8||t.n>=S.maxTr-1?1:0;
if(t.n>=S.maxTr&&!w.some(x=>/limit/.test(x)))w.push(t.n+' trades already ('+S.maxTr+' allowed)');if(dr&&!dr.sl){lv=Math.max(lv,1);w.push('no stop-loss set')}
return{lv,w:w.length?w:['All clear on your own rules']}}
/* ---------- charts ---------- */
const bar=(x,y,w,h,c,tt)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,w).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" rx="2" fill="${c}"><title>${esc(tt||'')}</title></rect>`;
function lineChart(C,T){const W=760,H=270,pl=6,pr=6,pt=12,pb=18,n=C.n,st=Math.max(1,Math.ceil(n/700)),ix=[];for(let i=0;i<n;i+=st)ix.push(i);if(ix[ix.length-1]!=n-1)ix.push(n-1);
const A=eqv=='dd'?C.ddc:C.eq,all=[0,...A,...(eqv=='n'?C.dis:[])],lo=Math.min(...all),hi=Math.max(...all)||1,X=i=>pl+(W-pl-pr)*(n>1?i/(n-1):0),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/((hi-lo)||1)),P=a=>ix.map((i,k)=>(k?'L':'M')+X(i).toFixed(1)+' '+Y(a[i]).toFixed(1)).join('');
const z=Y(0),cls=first?' class="dr" pathLength="1"':'',col=eqv=='dd'?'var(--dn)':'var(--ac)';
return`<div class="cw" id="eqw"><svg id="eqs" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
<line x1="${pl}" x2="${W-pr}" y1="${z}" y2="${z}" stroke="var(--ln)" stroke-dasharray="3 4"/><path d="${P(A)}L${X(n-1)} ${z}L${X(0)} ${z}Z" fill="url(#gr)"/>
${eqv=='n'?`<path d="${P(C.dis)}" fill="none" stroke="var(--up)" stroke-width="1.6" stroke-dasharray="5 4" opacity=".9"/>`:''}<path d="${P(A)}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round"${cls}/>
<line id="eqx" y1="${pt}" y2="${H-pb}" stroke="var(--mu)" opacity="0"/></svg><div class="tip" id="eqt"></div></div>`}
function wireEq(C,T){const w=$('#eqw');if(!w)return;const s=$('#eqs'),x=$('#eqx'),t=$('#eqt'),n=C.n,W=760;w.onmousemove=w.ontouchmove=e=>{const p=e.touches?e.touches[0]:e,r=s.getBoundingClientRect(),i=Math.max(0,Math.min(n-1,Math.round(((p.clientX-r.left)/r.width*W-6)/(W-12)*(n-1)))),tr=T[i];if(!tr)return;
x.setAttribute('x1',6+(W-12)*(n>1?i/(n-1):0));x.setAttribute('x2',x.getAttribute('x1'));x.setAttribute('opacity',.6);t.style.display='block';t.style.left=Math.min(r.width-190,Math.max(0,p.clientX-r.left+12))+'px';t.style.top='6px';
t.innerHTML=`#${i+1} · ${new Date(tr.t).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} · ${esc(tr.sym)}<br><b class="num">${m(C.eq[i],0)}</b> total · <span class="${cl(C.p[i])} num">${m(C.p[i])}</span>`};w.onmouseleave=()=>{t.style.display='none';x.setAttribute('opacity',0)}}
function hist(T){const v=(hm=='r'?T.map(R).filter(x=>x!=null):T.map(net));if(v.length<5)return'<div class="mu s">Need at least 5 trades.</div>';const lo=Math.min(...v),hi=Math.max(...v),B=14,w=(hi-lo)/B||1,b=Array(B).fill(0);v.forEach(x=>b[Math.min(B-1,Math.floor((x-lo)/w))]++);const mx=Math.max(...b),W=380,H=170,bw=(W-10)/B,mean=sum(v)/v.length,f=x=>hm=='r'?x.toFixed(1)+'R':m(x,0);
return`<svg viewBox="0 0 ${W} ${H+16}">${b.map((c,i)=>{const mid=lo+w*(i+.5),h=c/mx*(H-8);return bar(5+i*bw,H-h,bw-2,h,mid>=0?'var(--up)':'var(--dn)',`${f(lo+w*i)} to ${f(lo+w*(i+1))}: ${c} trades`)}).join('')}
<line x1="${5+(mean-lo)/(w*B)*(W-10)}" x2="${5+(mean-lo)/(w*B)*(W-10)}" y1="0" y2="${H}" stroke="var(--ac)" stroke-dasharray="3 3"/><text x="5" y="${H+13}" font-size="10" fill="var(--mu)">${f(lo)}</text><text x="${W-5}" y="${H+13}" font-size="10" fill="var(--mu)" text-anchor="end">${f(hi)} · mean ${f(mean)}</text></svg>`}
function heat(T){const g={};T.forEach(t=>{const d=new Date(t.t),h=d.getHours(),k=d.getDay()-1;if(k<0||k>4||h<9||h>15)return;(g[h+'_'+k]=g[h+'_'+k]||[]).push(net(t))});const mx=Math.max(1,...Object.values(g).map(a=>Math.abs(sum(a)/a.length)));let o='<div style="display:grid;grid-template-columns:34px repeat(5,1fr);gap:3px;font-size:11px" class="mu"><span></span>'+['Mon','Tue','Wed','Thu','Fri'].map(d=>`<span style="text-align:center">${d}</span>`).join('');
for(let h=9;h<=15;h++){o+=`<span>${h}:00</span>`;for(let k=0;k<5;k++){const a=g[h+'_'+k]||[],v=a.length?sum(a)/a.length:0,al=a.length?.15+.65*Math.abs(v)/mx:0,op=a.length<5?.45:1;o+=`<div title="${a.length} trades, avg ${m(v)}" style="height:30px;border-radius:6px;border:1px solid var(--ln);background:${a.length?`rgb(${v>=0?'25 211 143':'255 122 89'}/${al})`:'none'};opacity:${op};display:flex;align-items:center;justify-content:center;color:var(--tx)">${a.length?(v>=0?'▲':'▼')+a.length:''}</div>`}}return o+'</div><div class="s mu" style="margin-top:6px">Average P&amp;L by exit time. Number = trades. Faded cells have fewer than 5 trades.</div>'}
function cal(T){const d=byDay(T),dv={};Object.entries(d).forEach(([k,a])=>dv[k]=sum(a.map(net)));if(!cm){const l=T.length?new Date(T[T.length-1].t):new Date();cm=new Date(l.getFullYear(),l.getMonth(),1)}
const mx=Math.max(1,...Object.values(dv).map(Math.abs)),n=new Date(cm.getFullYear(),cm.getMonth()+1,0).getDate();let tot=0,c='';for(let i=0;i<cm.getDay();i++)c+='<span></span>';
for(let i=1;i<=n;i++){const v=dv[D(new Date(cm.getFullYear(),cm.getMonth(),i).getTime())];if(v!=null)tot+=v;c+=`<div title="${v==null?'No trades':m(v)}" style="${v==null?'':`background:rgb(${v>=0?'25 211 143':'255 122 89'}/${.15+.6*Math.abs(v)/mx})`}"><span class="mu">${i}</span>${v==null?'':`<span style="text-align:center">${v>=0?'▲':'▼'}</span>`}</div>`}
return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><button class="b" onclick="cmv(-1)">‹</button><b>${cm.toLocaleString('en-IN',{month:'long',year:'numeric'})} <span class="num ${cl(tot)}">${m(tot)}</span></b><button class="b" onclick="cmv(1)">›</button></div><div class="cal">${c}</div>`}
function cnt(T){const o=optCount(T),mx=Math.max(1,...o.rows.map(r=>Math.abs(r.a))),W=380,H=130,bw=(W-10)/6;return`<svg viewBox="0 0 ${W} ${H+30}"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="var(--ln)"/>${o.rows.map((r,i)=>{const h=Math.abs(r.a)/mx*(H/2-6);return bar(8+i*bw,r.a>=0?H/2-h:H/2,bw-10,h,r.a>=0?'var(--up)':'var(--dn)',`Trade #${r.j}: avg ${m(r.a)} (${r.n} trades)`)+`<text x="${8+i*bw+(bw-10)/2}" y="${H+14}" font-size="10" fill="var(--mu)" text-anchor="middle">#${r.j}${i==5?'+':''}</text><text x="${8+i*bw+(bw-10)/2}" y="${H+26}" font-size="9" fill="var(--mu)" text-anchor="middle">n=${r.n}</text>`}).join('')}</svg><div class="s" style="margin-top:4px">${o.msg}</div>`}
function waterfall(T){const mt=T.filter(t=>t.tag.length),d=sum(T.filter(t=>!t.tag.length).map(gross)),mi=sum(mt.map(gross)),ch=-sum(T.map(t=>t.ch||0)),st=[['Disciplined',d],['Tagged mistakes',mi],['Charges',ch]];let run=0;const seg=st.map(([l,v])=>{const a=run;run+=v;return{l,a,b:run,v}});seg.push({l:'Net',a:0,b:run,v:run,t:1});
const all=[0,...seg.flatMap(s=>[s.a,s.b])],lo=Math.min(...all),hi=Math.max(...all),W=380,H=150,Y=v=>6+(H-12)*(1-(v-lo)/((hi-lo)||1)),bw=(W-10)/4;
return`<svg viewBox="0 0 ${W} ${H+18}">${seg.map((s,i)=>bar(8+i*bw,Math.min(Y(s.a),Y(s.b)),bw-12,Math.abs(Y(s.a)-Y(s.b)),s.t?'var(--ac)':s.v>=0?'var(--up)':'var(--dn)',s.l+': '+m(s.v))+`<text x="${8+i*bw+(bw-12)/2}" y="${H+13}" font-size="10" fill="var(--mu)" text-anchor="middle">${s.l}</text>`).join('')}<line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ln)" stroke-dasharray="3 4"/></svg>`}

const L=leaks(T),t=tilt(T),g=gateOf(T),gl=['G','A','Rd'][g.lv],gt=['GREEN – go ahead','AMBER – slow down','RED – step away'][g.lv],tl=t.s>=60?'Tilt':t.s>=30?'Warming up':'Calm',kp=[['Net P&L',C.net,v=>m(v),cl(C.net)],['Win rate',C.wr*100,v=>v.toFixed(1)+'%',''],['Profit factor',isFinite(C.pf)?C.pf:0,v=>isFinite(C.pf)?v.toFixed(2):'∞',''],['Expectancy / trade',C.ex,v=>m(v),cl(C.ex)],['Max drawdown',-C.dd,v=>C.dd?'▼ '+m(v,0):'—','dn'],['Discipline',C.disc*100,v=>Math.round(v)+'%',''],['Cost of indiscipline',C.cost,v=>m(-v),C.cost?'dn':'']];
$('#app').innerHTML=`<div class="g k">${kp.map((k,i)=>`<div class="c ${i?'':'hero'}" style="animation-delay:${i*.05}s"><div class="kl">${k[0]}</div><div class="kv num ${k[3]}" id="kp${i}"></div>${i==1&&C.n<30?`<div class="s mu">Only ${C.n} trades – rough guide</div>`:''}${i==5?'<div class="s mu">no mistake tag + stop-loss set</div>':''}</div>`).join('')}</div>
<div class="g r2"><div class="c"><div class="tg">${[['n','Net'],['dd','Drawdown']].map(([k,l])=>`<button class="${eqv==k?'on':''}" onclick="eqv='${k}';first=0;render()">${l}</button>`).join('')}</div><h3>Equity after every trade</h3><div class="sub">${eqv=='n'?`<span style="color:var(--ac)">━</span> actual &nbsp;<span style="color:var(--up)">┅</span> if you skipped every tagged mistake → <b class="${C.cost?'dn':'up'}">cost of indiscipline ${m(C.cost,0)}</b>`:'Underwater curve: how far below your peak you were'}</div>${lineChart(C,T)}</div>
<div class="c"><h3>Pre-trade gate</h3><div class="sub">${t.day==D(Date.now())?'Today':'Based on last logged day ('+t.day+')'} · ${t.n} trades · ${m(t.dn)}</div><span class="pill ${gl}">${gt}</span><ul class="s" style="margin:8px 0 12px 18px">${g.w.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<h3>Tilt meter · <span class="${gl}">${tl}</span></h3><div style="height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin:6px 0"><div style="width:${t.s}%;height:100%;background:linear-gradient(90deg,var(--up),#f5b942,var(--dn));transition:width .8s"></div></div><div class="s mu">${t.w.length?t.w.join(' · '):'No warning signs'}</div>
<h3 style="margin-top:12px">Your rules</h3><div class="f"><div><label>Max loss / day ₹</label><input type="number" value="${S.lossLim}" onchange="S.lossLim=+this.value||1;save();first=0;render()"></div><div><label>Max trades / day</label><input type="number" value="${S.maxTr}" onchange="S.maxTr=+this.value||1;save();first=0;render()"></div></div></div></div>
<div class="g r2e"><div class="c"><h3>Leak finder</h3><div class="sub">Where your money leaks, ranked in ₹ (past results, not a prediction)</div>${L.length?L.map((l,i)=>`<div class="lk"><div class="x dn num">${i+1}. ${m(-l.c,0)}</div><div><b>${esc(l.t)}</b> <span class="s mu">· ${l.n} trades${l.n<30?' · small sample':''}</span><div class="s mu">→ ${esc(l.a)}</div></div></div>`).join(''):'<div class="mu s">No clear leaks yet. Tag mistakes on your trades below and they show up here.</div>'}</div>

<div class="g r3"><div class="c"><div class="tg">${[['r','R'],['p','₹']].map(([k,l])=>`<button class="${hm==k?'on':''}" onclick="hm='${k}';first=0;render()">${l}</button>`).join('')}</div><h3>Result distribution</h3><div class="sub">${hm=='r'?'R-multiple (needs a stop-loss)':'Net P&L per trade'} · dashed = mean</div>${hist(T)}</div><div class="c"><h3>Best &amp; worst times</h3><div class="sub">Time of day × weekday</div>${heat(T)}</div><div class="c"><h3>Calendar</h3><div class="sub">Daily net P&amp;L</div>${cal(T)}</div></div>

/* ---------- actions ---------- */
function say(s){$('#msg').textContent=s}
function tg(k){S[k]=k=='theme'?(S.theme=='dark'?'light':'dark'):S[k]?0:1;save();render()}
function cmv(n){cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);first=0;render()}
function tagT(id,v){const t=S.tr.find(x=>x.id==id);if(t){t.tag=v?[v]:[];save();first=0;render()}}
function del(id){const o=S.tr;S.tr=o.filter(x=>x.id!=id);save();first=0;render();say('Trade deleted. ');const u=document.createElement('button');u.className='b';u.textContent='Undo';u.onclick=()=>{S.tr=o;save();render();say('')};$('#msg').append(u)}
function fresh(){if(confirm('Remove ALL trades from this browser? Export first if you want a backup.')){S.tr=[];S.demo=0;save();render()}}

function addT(){const q=+$('#a_q').value,e=+$('#a_e').value,x=+$('#a_x').value,sym=$('#a_sym').value.trim();if(!sym||!(q>0)||!(e>0)||!(x>0)){alert('Symbol, quantity, entry and exit are required (numbers above 0).');return}
const mi=$('#a_m').value;S.tr.push({id:'u'+Date.now(),t:Date.now(),sym:sym.toUpperCase(),s:$('#a_s').value,q,e,x,sl:+$('#a_sl').value||0,ch:+$('#a_ch').value||0,tag:mi?[mi]:[]});if(S.demo&&S.tr.length&&S.tr[0].id[0]=='d'){say('Saved. Tip: use "Start fresh" to remove the demo trades.')}localStorage.setItem('bft_last_sym',sym.toUpperCase());save();$('#dlg').close();first=0;render()}
function csvRows(s){const r=[];let row=[],f='',q=0;s=s.replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&s[i+1]=='\n')i++;row.push(f);f='';r.push(row);row=[]}else f+=c}if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function pd(s){s=s.trim();let a=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})(.*)$/.exec(s);if(a)s=`${a[3]}-${a[2].padStart(2,'0')}-${a[1].padStart(2,'0')}${a[4]}`;const t=Date.parse(s.replace(' ','T'));return isNaN(t)?null:t}
async function imp(inp){const f=inp.files[0];inp.value='';if(!f)return;if(f.size>10e6){say('File is over 10 MB.');return}const R2=csvRows(await f.text()),h=(R2.shift()||[]).map(x=>x.toLowerCase().replace(/[^a-z0-9]/g,'')),ix=(...n)=>h.findIndex(x=>n.includes(x)),c={t:ix('exittime','time','datetime','date','tradetime','timestamp'),sym:ix('symbol','instrument','tradingsymbol'),s:ix('side','type','tradetype','direction'),q:ix('qty','quantity'),e:ix('entry','entryprice','buyprice'),x:ix('exit','exitprice','sellprice'),sl:ix('sl','stoploss'),ch:ix('charges','fees','costs')};
if(c.t<0||c.sym<0||c.q<0||c.e<0||c.x<0){say('Needs one row per COMPLETED trade with columns: date/time, symbol, side, qty, entry, exit (optional: sl, charges). Fill-by-fill broker tradebooks are not supported on this page yet.');return}
const have=new Set(S.tr.map(t=>[t.t,t.sym,t.q,t.e,t.x].join('|')));let ok=0,dup=0,bad=0;R2.forEach(r=>{const t=pd(r[c.t]||''),q=+r[c.q],e=+String(r[c.e]).replace(/,/g,''),x=+String(r[c.x]).replace(/,/g,''),sd=/^(s|sell|short)/i.test((r[c.s]||'').trim())?'S':'L';if(t==null||!r[c.sym]||!(q>0)||!(e>0)||!(x>0)){bad++;return}
const k=[t,r[c.sym],q,e,x].join('|');if(have.has(k)){dup++;return}have.add(k);S.tr.push({id:'i'+t+'_'+ok,t,sym:r[c.sym].trim().toUpperCase(),s:sd,q,e,x,sl:c.sl>=0?+r[c.sl]||0:0,ch:c.ch>=0?+r[c.ch]||0:0,tag:[]});ok++});
